<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140E2C"/>
      <stop offset="1" stop-color="#221A4E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 霓虹光晕（screen 叠加效果用低透明度模拟） -->
  <g opacity="0.55" style="mix-blend-mode:screen">
    <circle cx="250" cy="150" r="250" fill="#8B5CF6" filter="url(#glow)"/>
    <circle cx="1020" cy="110" r="230" fill="#FF7AC6" filter="url(#glow)"/>
    <circle cx="930" cy="585" r="280" fill="#60B8FF" filter="url(#glow2)"/>
  </g>

  <!-- 质感网格 -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 信息层 -->
  <text x="80" y="116" font-size="32" font-weight="700" fill="#C4B5FD">AIGC 视频设计师</text>
  <text x="80" y="164" font-size="28" font-weight="400" fill="#D2C3FF">CHAOLUN</text>
  <text x="78" y="282" font-size="152" font-weight="700" fill="#F4F1FF">晁伦</text>
  <text x="82" y="396" font-size="38" font-weight="400" fill="#B9B0E0">用 AI 造有质感的视频与视觉</text>

  <!-- 标签 chips -->
  <g transform="translate(0, 488)">
    <rect x="80" width="200" height="58" rx="29" fill="#201848" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="180" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">文生视频</text>

    <rect x="300" width="200" height="58" rx="29" fill="#201848" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="400" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">图生视频</text>

    <rect x="520" width="330" height="58" rx="29" fill="#201848" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="685" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">AI 创意工作流</text>
  </g>

  <!-- 底部 -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#ffffff" stroke-opacity="0.13"/>
  <text x="1120" y="590" text-anchor="end" font-size="26" font-weight="400" fill="#D2C3FF">chaolun.dev</text>

  <!-- 右上 SHOWREEL 徽标 -->
  <text x="1058" y="80" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">SHOWREEL</text>
  <circle cx="1058" cy="138" r="46" fill="none" stroke="#C4B5FD" stroke-width="3"/>
  <path d="M1046 122 v32 l30 -16 z" fill="#F4F1FF"/>
</svg>
